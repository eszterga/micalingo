  <body>
    <script>
      // Migrate legacy HashRouter links (#/quizzes) → clean paths (/quizzes) for SEO & bookmarks.
      (function () {
        var hash = window.location.hash || '';
        if (!hash || hash === '#' || hash === '#/') {
          if (hash === '#/' && (!window.location.pathname || window.location.pathname === '/')) {
            window.history.replaceState(null, '', '/' + window.location.search);
          }
          return;
        }
        if (hash.charAt(0) !== '#') return;
        var raw = hash.slice(1);
        if (!raw) return;
        var path = raw.charAt(0) === '/' ? raw : '/' + raw;
        var qIndex = path.indexOf('?');
        var pathOnly = qIndex === -1 ? path : path.slice(0, qIndex);
        var hashQuery = qIndex === -1 ? '' : path.slice(qIndex);
        var search = window.location.search || hashQuery;
        if (hashQuery && window.location.search) {
          search = window.location.search + '&' + hashQuery.slice(1);
        }
        window.location.replace(pathOnly + search);
      })();
    </script>
